name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        env:
          DISCORD_WEBHOOK_URL: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: python -m pytest -v --tb=short --timeout=30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/jobs-tracker-bot

            # Backup DB before deploy
            bash scripts/backup.sh 2>/dev/null || true

            # Pull and build without replacing the healthy container
            git pull origin main
            sudo docker compose build

            # Validate public employer feeds and the complete pipeline.
            sudo docker compose run --rm --no-deps job-bot python main.py --validate-sources
            sudo docker compose run --rm --no-deps job-bot python main.py --dry-run --max-age 14

            # Replace only after validation succeeds.
            sudo docker compose up -d

            # Wait for health check
            echo "Waiting for container..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "✓ Health check passed"
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed"
              sudo docker compose logs --tail=100 job-bot
              exit 1
            fi

            sudo docker compose ps
            echo "Deploy complete"
