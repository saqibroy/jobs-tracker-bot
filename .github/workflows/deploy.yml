name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        env:
          DISCORD_WEBHOOK_URL: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: python -m pytest -v --tb=short --timeout=30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/jobs-tracker-bot

            # Backup DB before deploy
            bash scripts/backup.sh 2>/dev/null || true

            # Pull and build without replacing the healthy container. Runtime
            # discovery can append to tracked seed files on the server between
            # workflow runs, so autostash keeps those local discoveries from
            # blocking deploys.
            git pull --rebase --autostash origin main
            sudo docker compose build

            # Validate public employer feeds before replacing the container.
            sudo docker compose run --rm --no-deps job-bot python main.py --validate-sources

            # Replace only after validation succeeds. The app runs an immediate
            # startup scan, so use the real health summary as the pipeline gate
            # instead of duplicating a full 10k+ job dry-run inside deploy.
            sudo docker compose up -d

            # Wait for the container and its startup scan.
            echo "Waiting for container startup scan..."
            HEALTHY=false
            for i in $(seq 1 90); do
              if HEALTH_JSON=$(curl -sf --max-time 5 http://localhost:8080/health) && \
                HEALTH_JSON="$HEALTH_JSON" python3 -c 'import json, os, sys; payload=json.loads(os.environ["HEALTH_JSON"]); summary=payload.get("last_scan_summary") or {}; ok=payload.get("status") == "ok" and int(summary.get("raw") or 0) > 0; print("✓ Health check passed — raw={} matches={} immediate={} digest={}".format(summary.get("raw"), summary.get("eligible_role_matches"), summary.get("immediate"), summary.get("digest"))) if ok else None; sys.exit(0 if ok else 1)'
              then
                HEALTHY=true
                break
              fi
              sleep 10
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health/startup scan check failed"
              sudo docker compose logs --tail=100 job-bot
              exit 1
            fi

            sudo docker compose ps
            echo "Deploy complete"
