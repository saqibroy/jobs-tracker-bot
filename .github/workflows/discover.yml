name: Discover employer boards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: discover-employer-boards
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Import Zoho candidates from production
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "Oracle SSH secrets unavailable; skipping Zoho candidate import."
            exit 0
          fi

          mkdir -p ~/.ssh data/discovery
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          if scp -i ~/.ssh/oracle_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "opc@$ORACLE_HOST:~/jobs-tracker-bot/data/discovery/zoho_mail_candidates.txt" \
            /tmp/zoho_mail_candidates.remote.txt; then
            if [ -s /tmp/zoho_mail_candidates.remote.txt ]; then
              cp /tmp/zoho_mail_candidates.remote.txt data/discovery/zoho_mail_candidates.txt
            fi
          else
            echo "No production Zoho candidate file available yet; continuing."
          fi

      - name: Discover and promote employer boards
        env:
          DISCORD_WEBHOOK_URL: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: |
          GOOGLE_ARGS=""
          if [ -n "$GOOGLE_API_KEY" ] && [ -n "$GOOGLE_CX" ]; then
            GOOGLE_ARGS="--google"
          fi

          python scripts/discover_companies.py --from-env \
            --seed-file seeds/companies-seed.txt \
            --seed-file data/discovery/sniffed_from_jobs.txt \
            --seed-file data/discovery/zoho_mail_candidates.txt \
            --detect-domains --new-only \
            --min-jobs 1 --promote $GOOGLE_ARGS

      # Each candidate is live-validated before promotion. Keep the wider
      # catalog check visible without letting an unrelated retired or
      # temporarily unavailable board suppress discovery commits.
      - name: Diagnose configured boards
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: python main.py --validate-sources

      - name: Upload discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-report-${{ github.run_id }}
          path: data/discovery/
          if-no-files-found: ignore

      - name: Commit discovery updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add companies.toml data/discovery/sniffed_from_jobs.txt data/discovery/zoho_mail_candidates.txt

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "companies_changed=false" >> "$GITHUB_OUTPUT"
            echo "No discovery changes to commit."
            exit 0
          fi

          if git diff --cached --quiet -- companies.toml; then
            echo "companies_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "companies_changed=true" >> "$GITHUB_OUTPUT"
          fi

          git commit -m "chore: auto-discover companies"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy workflow
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.companies_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
